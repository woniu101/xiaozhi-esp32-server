# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /xiaozhi
    session:
      cookie:
        http-only: true

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true

knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin
  setting:
    enableFooter: false

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: xiaozhi.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE

companion:
  # 本地源码开发默认连接同机 xiaozhi-server；Docker Compose 必须通过环境变量覆盖为服务名。
  compiler-url: ${COMPANION_COMPILER_URL:http://127.0.0.1:8003}
  artifact-dir: ${COMPANION_ARTIFACT_DIR:/uploadfile/personas}
  # Destructive Persona reset is disabled outside explicitly opted-in development environments.
  # 可选。公开仓库在 GitHub REST API 限流时会自动使用 Git smart-HTTP 降级解析。
  github-token: ${PERSONA_GITHUB_TOKEN:}
